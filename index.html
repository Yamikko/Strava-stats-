<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Stats course</title>
<style>
  :root{
    --bg:#0b0d10; --card:#15181d; --sub:#1b1f25; --line:#272c34;
    --fg:#f2f4f7; --dim:#8b94a1; --accent:#fc5200;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
    max-width:1060px; margin-inline:auto; font-variant-numeric:tabular-nums;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{font-size:21px;font-weight:650;margin:0;letter-spacing:-.015em}
  #maj{font-size:12px;color:var(--dim)}

  .cols{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  .col{display:grid;gap:12px}
  @media (min-width:860px){ .cols{grid-template-columns:1fr 1fr .8fr} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card h2{font-size:11px;font-weight:600;margin:0 0 12px;color:var(--dim);
           text-transform:uppercase;letter-spacing:.08em}

  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mini{background:var(--sub);border:1px solid var(--line);border-radius:12px;padding:12px}
  .mini .lab{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .mini .val{font-size:27px;font-weight:650;margin-top:4px;line-height:1}
  .mini .val span{font-size:12px;font-weight:500;color:var(--dim);margin-left:3px}

  .big{font-size:40px;font-weight:650;line-height:1;margin:2px 0 12px}
  .big span{font-size:14px;font-weight:500;color:var(--dim);margin-left:4px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 0;text-align:right;font-size:15px}
  thead th+th,tbody td+td{padding-left:10px}
  th:first-child,td:first-child{text-align:left;font-weight:500}
  thead th{font-size:11px;color:var(--dim);font-weight:500;padding-bottom:2px;
           text-transform:uppercase;letter-spacing:.06em}
  tbody tr+tr td{border-top:1px solid var(--line)}
  .me{color:var(--accent);font-weight:650}
  td .sub{font-size:11px;color:var(--dim);font-weight:400;margin-left:5px}
  .na{color:var(--dim)}
  tr.total td{border-top:1px solid var(--line);font-weight:650;padding-top:11px}

  .run{text-align:center;padding:6px 0 2px}
  .run .date{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .run .line{font-size:30px;font-weight:650;line-height:1.25;margin-top:10px}
  .run .line span{font-size:14px;font-weight:500;color:var(--dim)}
  .run .allure{font-size:13px;color:var(--dim);margin-top:10px}

  #trace{width:100%;height:auto;display:block;max-height:260px}
  .tmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:8px}
  .tmeta span:first-child{color:var(--fg);font-weight:600}

  .goal{font-size:14px;color:var(--dim);margin:0 0 4px}
  .goal b{color:var(--fg);font-weight:600}
  .bar{height:7px;border-radius:99px;background:var(--sub);
       border:1px solid var(--line);overflow:hidden;margin:12px 0 8px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;
         width:0;transition:width .5s ease}
  .barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

  button{width:100%;padding:14px;margin-top:14px;border-radius:12px;
         border:1px solid var(--line);background:var(--card);color:var(--fg);
         font-size:15px;font-family:inherit}
  button:active{background:#1f242b}
  .err{color:#ff6b6b;font-size:14px;text-align:center;padding:10px 0}
</style>
</head>
<body>

<header>
  <h1>Stats course</h1>
  <span id="maj"></span>
</header>

<div class="cols">

  <div class="col">
    <div class="card">
      <h2>Données</h2>
      <div class="duo">
        <div class="mini"><div class="lab">Semaine</div><div class="val" id="v-sem">–</div></div>
        <div class="mini"><div class="lab">Mois</div><div class="val" id="v-mois">–</div></div>
      </div>
    </div>
    <div class="card">
      <h2 id="h-annee">Année</h2>
      <div class="big" id="v-an">–</div>
      <table><tbody id="annees"></tbody></table>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2>Meilleurs temps</h2>
      <table>
        <thead><tr><th></th><th>Baptiste</th><th>Romane</th><th>Papa</th></tr></thead>
        <tbody>
          <tr><td>5 km</td><td class="me" id="b5">–</td><td id="r5">–</td><td id="p5">–</td></tr>
          <tr><td>10 km</td><td class="me" id="b10">–</td><td id="r10">–</td><td id="p10">–</td></tr>
          <tr><td>Semi <span class="sub">21,1 km</span></td><td class="me" id="bs">–</td><td id="rs">–</td><td id="ps">–</td></tr>
          <tr><td>Marathon <span class="sub">42,2 km</span></td><td class="me" id="bm">–</td><td id="rm">–</td><td id="pm">–</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>Semi-marathon</h2>
      <p class="goal" id="goal-txt">–</p>
      <div class="bar"><i id="bar"></i></div>
      <div class="barlab">
        <span id="bar-left">–</span>
        <span>21,1 km</span>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="card" id="carte-trace" hidden>
      <h2>Plus long parcours</h2>
      <svg id="trace" viewBox="-40 -40 1080 1080" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Tracé de la plus longue sortie">
        <polyline id="trace-l" fill="none" stroke="var(--accent)" stroke-width="18"
                  stroke-linejoin="round" stroke-linecap="round" />
        <circle id="trace-a" r="30" fill="var(--card)" stroke="var(--fg)" stroke-width="12" />
      </svg>
      <div class="tmeta"><span id="trace-km">–</span><span id="trace-date"></span></div>
    </div>

    <div class="card">
      <h2>Dernière sortie</h2>
      <div class="run">
        <div class="date" id="run-date">–</div>
        <div class="line" id="run-line">–</div>
        <div class="allure" id="run-allure"></div>
      </div>
    </div>
  </div>

</div>

<div class="err" id="err" hidden></div>
<button id="refresh" type="button">Actualiser</button>

<script>
const $ = id => document.getElementById(id);
const nb = v => (Math.round(v*10)/10).toString().replace(".", ",");

function duree(sec){
  if(sec == null) return null;
  const t = Math.round(sec);
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  const mm = String(m).padStart(2,"0"), ss = String(s).padStart(2,"0");
  return h > 0 ? h + ":" + mm + ":" + ss : m + ":" + ss;
}
function allure(sec){
  if(sec == null) return "";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m + "'" + String(s).padStart(2,"0") + '"/km';
}
function km(v){ return v == null ? "–" : nb(v) + '<span>km</span>'; }
function setTemps(el, obj){
  if(!obj){ el.innerHTML = '<span class="na">–</span>'; el.removeAttribute("title"); return; }
  el.innerHTML = duree(obj.temps_sec) +
    (obj.exact === false ? ' <span class="sub">' + nb(obj.km) + ' km</span>' : "");
  el.title = obj.date + " — " + nb(obj.km) + " km";
}
function dateFr(iso){
  if(!iso) return "–";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("fr-FR", {day:"numeric", month:"short", year:"numeric"}).toUpperCase();
}

async function charger(){
  $("err").hidden = true;
  try{
    const r = await fetch("stats.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();

    $("v-sem").innerHTML  = km(d.semaine && d.semaine.km);
    $("v-mois").innerHTML = km(d.mois && d.mois.km);
    $("v-an").innerHTML   = km(d.annee && d.annee.km);
    if(d.annee && d.annee.label) $("h-annee").textContent = "Année (" + d.annee.label + ")";

    const pa = d.par_annee || {};
    $("annees").innerHTML =
      Object.keys(pa).sort().map(a =>
        "<tr><td>" + a + "</td><td>" + nb(pa[a]) + " km</td></tr>").join("") +
      (d.total_km != null
        ? "<tr class='total'><td>Total</td><td class='me'>" + nb(d.total_km) + " km</td></tr>"
        : "");

    const mt = d.meilleurs_temps || {};
    setTemps($("b5"),  mt["5km"]  && mt["5km"].baptiste);
    setTemps($("r5"),  mt["5km"]  && mt["5km"].romane);
    setTemps($("b10"), mt["10km"] && mt["10km"].baptiste);
    setTemps($("r10"), mt["10km"] && mt["10km"].romane);
    setTemps($("bs"),  mt["semi"] && mt["semi"].baptiste);
    setTemps($("rs"),  mt["semi"] && mt["semi"].romane);
    setTemps($("bm"),  mt["marathon"] && mt["marathon"].baptiste);
    setTemps($("rm"),  mt["marathon"] && mt["marathon"].romane);
    setTemps($("p5"),  mt["5km"]      && mt["5km"].papa);
    setTemps($("p10"), mt["10km"]     && mt["10km"].papa);
    setTemps($("ps"),  mt["semi"]     && mt["semi"].papa);
    setTemps($("pm"),  mt["marathon"] && mt["marathon"].papa);

    const s = d.semi;
    if(s){
      $("goal-txt").innerHTML = "Objectif dans <b>" + s.semaines_restantes + " semaines</b>" +
        " — plus longue sortie récente : <b>" + nb(s.plus_longue_90j) + " km</b>";
      $("bar").style.width = Math.round((s.progression || 0) * 100) + "%";
      $("bar-left").textContent = nb(s.plus_longue_90j) + " km";
    }

    const pl = d.plus_long_parcours;
    if(pl && Array.isArray(pl.trace) && pl.trace.length > 1){
      $("trace-l").setAttribute("points", pl.trace.map(p => p[0] + "," + p[1]).join(" "));
      const a = pl.trace[0];
      $("trace-a").setAttribute("cx", a[0]); $("trace-a").setAttribute("cy", a[1]);
      $("trace-km").textContent = nb(pl.km) + " km";
      $("trace-date").textContent = dateFr(pl.date);
      $("carte-trace").hidden = false;
    }

    const ds = d.derniere_sortie;
    if(ds){
      $("run-date").textContent = dateFr(ds.date);
      $("run-line").innerHTML = nb(ds.km) + " <span>km</span><br>en " +
        Math.round(ds.duree_min) + " <span>min</span>";
      $("run-allure").textContent = ds.allure_sec_km ? "allure " + allure(ds.allure_sec_km) : "";
    }

    $("maj").textContent = d.genere_le ? "maj " + d.genere_le : "";
  }catch(e){
    $("err").hidden = false;
    $("err").textContent = "Impossible de charger les données (" + e.message + ")";
  }
}

$("refresh").addEventListener("click", charger);
document.addEventListener("visibilitychange", () => { if(!document.hidden) charger(); });
charger();
setInterval(charger, 15*60*1000);
</script>
</body>
</html>
