<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Stats course</title>
<style>
  :root{
    --bg:#0b0d10; --card:#16191e; --line:#262b33;
    --fg:#f2f4f7; --dim:#9aa3af; --accent:#fc5200;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    max-width:620px; margin-inline:auto;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
  #maj{font-size:12px;color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
  .tile .lab{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .tile .val{font-size:26px;font-weight:650;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
  .tile .val span{font-size:13px;font-weight:500;color:var(--dim);margin-left:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 0;text-align:right;font-size:15px}
  th:first-child,td:first-child{text-align:left;font-weight:500}
  thead th{font-size:12px;color:var(--dim);font-weight:500;padding-bottom:4px}
  tbody tr+tr td{border-top:1px solid var(--line)}
  .me{color:var(--accent);font-weight:600}
  .na{color:var(--dim)}
  .last{font-size:13px;color:var(--dim);text-align:center;padding:2px 0 14px}
  button{
    width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:15px;font-family:inherit;
  }
  button:active{background:#1f242b}
  .err{color:#ff6b6b;font-size:14px;text-align:center;padding:10px 0}
</style>
</head>
<body>
<header>
  <h1>Stats course</h1>
  <span id="maj"></span>
</header>

<div class="grid">
  <div class="tile"><div class="lab">Semaine</div><div class="val" id="v-sem">–</div></div>
  <div class="tile"><div class="lab">Mois</div><div class="val" id="v-mois">–</div></div>
  <div class="tile"><div class="lab">Année</div><div class="val" id="v-an">–</div></div>
</div>

<div class="card">
  <h2>Meilleurs temps</h2>
  <table>
    <thead><tr><th></th><th>Baptiste</th><th>Romane</th></tr></thead>
    <tbody>
      <tr><td>5 km</td><td class="me" id="b5">–</td><td id="r5">–</td></tr>
      <tr><td>10 km</td><td class="me" id="b10">–</td><td id="r10">–</td></tr>
    </tbody>
  </table>
</div>

<div class="last" id="derniere"></div>
<div class="err" id="err" hidden></div>
<button id="refresh" type="button">Actualiser</button>

<script>
const $ = id => document.getElementById(id);

function mmss(sec){
  if(sec == null) return null;
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m + ":" + String(s).padStart(2,"0");
}
function km(v){
  return v == null ? "–" : Math.round(v*10)/10 + '<span>km</span>';
}
function setTemps(el, obj){
  const t = obj && mmss(obj.temps_sec);
  el.innerHTML = t || '<span class="na">–</span>';
  if(obj && obj.date) el.title = obj.date;
}

async function charger(){
  $("err").hidden = true;
  try{
    const r = await fetch("stats.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();

    $("v-sem").innerHTML = km(d.semaine && d.semaine.km);
    $("v-mois").innerHTML = km(d.mois && d.mois.km);
    $("v-an").innerHTML = km(d.annee && d.annee.km);

    const mt = d.meilleurs_temps || {};
    setTemps($("b5"),  mt["5km"]  && mt["5km"].baptiste);
    setTemps($("r5"),  mt["5km"]  && mt["5km"].romane);
    setTemps($("b10"), mt["10km"] && mt["10km"].baptiste);
    setTemps($("r10"), mt["10km"] && mt["10km"].romane);

    const ds = d.derniere_sortie;
    $("derniere").textContent = ds
      ? "Dernière sortie : " + (Math.round(ds.km*10)/10) + " km en " + Math.round(ds.duree_min) + " min, le " + ds.date
      : "";

    $("maj").textContent = d.genere_le ? "maj " + d.genere_le : "";
  }catch(e){
    $("err").hidden = false;
    $("err").textContent = "Impossible de charger les données (" + e.message + ")";
  }
}

$("refresh").addEventListener("click", charger);
document.addEventListener("visibilitychange", () => { if(!document.hidden) charger(); });
charger();
setInterval(charger, 15*60*1000);
</script>
</body>
</html>
